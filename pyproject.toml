[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-brain"
version = "0.2.0"
description = "Local-first memory, recall and knowledge vault for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.0.0",
  "fastembed>=0.4.0",
  "numpy>=1.26",
  "turbovec>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cc-brain = "cc_brain.cli:main"

[tool.setuptools.packages.find]
include = ["cc_brain*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]
